    <style>
         .ad-space {
            align-items: center;
            background-color: #f0f0f0;
           border: 1px dashed #999;
             display: flex;
            height: 100px;
            justify-content: center;
             margin-bottom: 20px;
            max-width: 600px;
            width: 100%;
        }
       .ad-space p {
            color: #777777;
           font-size: 0.9rem;
            text-align: center;
        }
        body {
            align-items: center;
            background: linear-gradient(to bottom, #a8b8e8, #ffffff);
             display: flex;
            flex-direction: column;
             justify-content: center;
            min-height: 100vh;
            padding-top: 20px;
            transition: background 0.5s;
         }
         body.boy-bg {
            background: linear-gradient(to bottom, #a8b8e8, #ffffff);
        }
       body.girl-bg {
            background: linear-gradient(to bottom, #fbcfe8, #ffffff);
        }
         body.pet-bg {
             background: linear-gradient(to bottom, #a0e9e0, #ffffff);
       }
         .btn-primary {
            animation: pulse 2s infinite;
             background-color: #3182ce;
            border-color: #3182ce;
        }
       @keyframes pulse {
            0% {
                transform: scale(1);
           }
            50% {
              transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }
         .btn-primary:hover {
             background-color: #2767a5;
            border-color: #2767a5;
        }
        .card {
             border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
             max-width: 600px;
            transition: box-shadow 0.3s;
            width: 100%;
        }
        .card:hover {
             box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .card-text {
             color: #6c757d;
        }
        .card-title {
            color: #343a40;
            font-size: 2rem;
        }
        .copy-button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1rem;
           margin-left: 5px;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
         .copy-button:hover {
             opacity: 1;
         }
         .copy-button.copied {
            opacity: 1;
        }
      footer {
            font-size: 0.8rem;
            margin-top: 20px;
            padding: 10px 0;
            text-align: center;
        }
       footer a {
           color: #facc15;
       }
        footer a:hover {
            color: #0d6efd;
        }
        .form-check-input:checked {
            background-color: #3182ce;
            border-color: #3182ce;
         }
        .form-check-label {
             color: #6c757d;
        }
        .generated-name {
           color: #1e3a8a;
            display: inline-block;
           font-size: 1.7rem;
            font-weight: bold;
             margin-top: 1rem;
            opacity: 1;
           transition: opacity 0.3s ease-in-out;
       }
       .generated-name.fade-in {
           opacity: 1;
        }
        .letter-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
             margin-top: 10px;
        }
         .letter-item {
            color: #aaa;
            cursor: pointer;
            font-size: 0.65rem;
           margin: 0 2px;
             padding: 2px 5px; /* Add padding */
            text-decoration: none;
           transition: all 0.2s;
         }
         .letter-item:hover {
           color: #333;
            font-size: 0.8rem;
           font-weight: bold;
            transform: scale(1.1);
        }
         .letter-item.selected {
          background-color: #cce5ff;
           color: #000;
       }
       .share-buttons {
           display: flex;
           justify-content: center;
           margin-top: 10px;
        }
       .share-button {
           background: none;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            margin: 0 5px;
           opacity: 0.6;
            transition: opacity 0.3s;
       }
         .share-button:hover {
            opacity: 1;
        }
        .spinner {
           animation: spin 1s linear infinite;
             border: 4px solid rgba(0, 0, 0, 0.1);
           border-left-color: #3182ce;
             border-radius: 50%;
            display: inline-block;
           height: 20px;
           margin-right: 5px;
            vertical-align: sub;
             width: 20px;
        }
        @keyframes spin {
           to {
             transform: rotate(360deg);
          }
       }
         @media (max-width: 768px) {
           body {
              padding-top: 10px;
           }
           .card {
                margin-top: 10px;
            }
            .ad-space {
                margin-bottom: 10px;
             }
        }

       const shareArea = document.getElementById('share-area');
         let generatedName = '';
       const body = document.querySelector('body');
         let selectedLetter = null;
       generateButton.addEventListener('click', () => {
            spinner.style.display = 'inline-block';
            setTimeout(() => {
                 spinner.style.display = 'none';
                let selectedType = '';
               radioButtons.forEach(radio => {
                    if (radio.checked) {
                       selectedType = radio.value;
                  }
               });
                let name = '';
                let filteredNames = [];
                 if (selectedType === 'menino') {
                    filteredNames = boyNames;
                } else if (selectedType === 'menina') {
                     filteredNames = girlNames;
               } else if (selectedType === 'pet') {
                    filteredNames = petNames;
                }
                 if (selectedLetter) {
                     filteredNames = filteredNames.filter(name => name.startsWith(selectedLetter));
                 }
                 if (filteredNames.length > 0) {
                    name = filteredNames[Math.floor(Math.random() * filteredNames.length)];
                  }
                generatedName = name;
               nameDisplay.innerHTML = `<span style="display:inline-flex; align-items: center;">${name} <button class="copy-button" onclick="copyNameToClipboard(this)"><i class="bi bi-clipboard"></i></button></span>`;
                 nameDisplay.classList.add('fade-in');
                 shareArea.style.display = 'block';
                 setTimeout(() => {
                     nameDisplay.classList.remove('fade-in');
                 }, 300);
            }, 500);
       });
        radioButtons.forEach(radio => {
            radio.addEventListener('change', function() {
               body.classList.remove('boy-bg', 'girl-bg', 'pet-bg');
                if (this.value === 'menino') {
                    body.classList.add('boy-bg');
                } else if (this.value === 'menina') {
                    body.classList.add('girl-bg');
                } else if (this.value === 'pet') {
                     body.classList.add('pet-bg');
               }
          });
       });
        const letterItems = document.querySelectorAll('.letter-item');
       letterItems.forEach(item => {
           item.addEventListener('click', function(e) {
                e.preventDefault();
                letterItems.forEach(i => i.classList.remove('selected'));
                 this.classList.add('selected');
                 selectedLetter = this.dataset.letter;
            });
       });
       function copyNameToClipboard(button) {
         navigator.clipboard.writeText(generatedName)
            .then(() => {
                const icon = button.querySelector('i');
               icon.classList.remove('bi-clipboard');
                icon.classList.add('bi-check-lg');
                button.classList.add('copied');
               setTimeout(() => {
                   icon.classList.remove('bi-check-lg');
                    icon.classList.add('bi-clipboard');
                   button.classList.remove('copied');
                }, 1000);
            })
           .catch(err => {
                console.error('Erro ao copiar o nome: ', err);
           });
      }
