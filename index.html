<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerador de Nomes Aleatórios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef2ff;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #4f46e5;
      --accent-soft: #e0e7ff;
    }
    body[data-theme='dark'] {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #818cf8;
      --accent-soft: #312e81;
    }
    body {
      background: linear-gradient(145deg, var(--bg), #ffffff);
      color: var(--text);
      min-height: 100vh;
      transition: 0.25s ease;
    }
    .app-card {
      background: var(--card);
      border: none;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
    }
    .generated-name {
      font-size: clamp(1.5rem, 3vw, 2.5rem);
      font-weight: 800;
      color: var(--accent);
      min-height: 3.4rem;
    }
    .letter-grid {
      display: grid;
      grid-template-columns: repeat(13, minmax(0, 1fr));
      gap: 0.35rem;
    }
    .letter-grid button {
      border: 1px solid #d1d5db;
      background: #fff;
      color: #111827;
      border-radius: 10px;
      font-weight: 700;
      padding: 0.3rem;
    }
    .letter-grid button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    body[data-theme='dark'] .letter-grid button {
      background: #334155;
      border-color: #475569;
      color: #e2e8f0;
    }
    .pill {
      background: var(--accent-soft);
      color: var(--text);
      border-radius: 999px;
      padding: 0.35rem 0.7rem;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .history-item,
    .favorite-item {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-9">
        <div class="app-card p-4 p-md-5">
          <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
            <h1 class="h2 m-0">🎲 Gerador de Nomes Aleatórios</h1>
            <button id="theme-toggle" class="btn btn-outline-secondary btn-sm" type="button">
              <i class="bi bi-moon-stars"></i> Tema
            </button>
          </div>

          <p class="text-secondary mb-4">Agora com base de nomes ampliada, busca por trecho e filtros combináveis.</p>

          <div class="generated-name text-center mb-2" id="generated-name" aria-live="polite">Seu próximo nome incrível aparece aqui ✨</div>

          <div class="d-flex justify-content-center gap-2 mb-4">
            <button id="generate-btn" class="btn btn-primary btn-lg"><i class="bi bi-shuffle"></i> Gerar nome</button>
            <button id="copy-btn" class="btn btn-outline-primary" disabled><i class="bi bi-clipboard"></i></button>
            <button id="favorite-btn" class="btn btn-outline-warning" disabled><i class="bi bi-star"></i></button>
            <button id="share-btn" class="btn btn-outline-success" disabled><i class="bi bi-share"></i></button>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-3">
              <label class="form-label">Categoria</label>
              <select id="category" class="form-select">
                <option value="menino">Menino</option>
                <option value="menina">Menina</option>
                <option value="pet">Pet</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Comprimento máximo</label>
              <input id="length" class="form-control" type="number" min="2" max="20" placeholder="Ex.: 8" />
            </div>
            <div class="col-md-3">
              <label class="form-label">Contém trecho</label>
              <input id="contains" class="form-control" type="text" placeholder="Ex.: li" />
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <div class="form-check">
                <input id="no-repeat" class="form-check-input" type="checkbox" checked />
                <label for="no-repeat" class="form-check-label">Evitar repetição recente</label>
              </div>
            </div>
          </div>

          <label class="form-label">Filtrar por inicial</label>
          <div class="letter-grid mb-4" id="letters"></div>

          <div class="d-flex flex-wrap gap-2 mb-4" id="stats"></div>

          <div class="row g-3">
            <div class="col-md-6">
              <h2 class="h5">Histórico (últimos 10)</h2>
              <ul id="history" class="list-group"></ul>
            </div>
            <div class="col-md-6">
              <h2 class="h5">Favoritos</h2>
              <ul id="favorites" class="list-group"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    const NAMES = {
      menino: ["Gabriel", "Lucas", "Miguel", "Arthur", "Enzo", "Pedro", "Rafael", "Gustavo", "Matheus", "Felipe", "Vitor", "Ricardo", "Daniel", "Thiago", "Leonardo", "Diego", "Henrique", "João", "Carlos", "Marcelo", "André", "Bruno", "Igor", "Fábio", "Fernando", "Samuel", "Eduardo", "Maurício", "Alexandre", "Luiz", "Vinícius", "José", "Caio", "William", "Douglas", "Erick", "Rodrigo", "Renan", "Cauã", "Augusto", "Davi", "Otávio", "Guilherme", "Yuri", "Luan", "Mateus", "Benjamin", "Enrico", "Alan", "Bernardo", "Leandro", "Ezequiel", "Isaac", "Nicolas", "Jorge", "Flávio", "Ian", "Hugo", "Mário", "Raul", "Marco", "Paulo", "Anderson", "Murilo", "Heitor", "Theo", "Breno", "Lorenzo", "Levi", "Nathan", "Ryan", "Vicente", "Yago", "Christian", "Danilo", "Fabrício", "Gael", "Ícaro", "Kenzo", "Oliver", "Pietro", "Saulo", "Thales", "Ulisses", "Wesley", "Xavier", "Zaqueu"],
      menina: ["Ana", "Beatriz", "Carolina", "Débora", "Fernanda", "Patrícia", "Juliana", "Gabriela", "Camila", "Renata", "Mariana", "Sabrina", "Raquel", "Aline", "Bianca", "Roberta", "Tatiane", "Daniela", "Luana", "Larissa", "Amanda", "Natália", "Jéssica", "Vanessa", "Tânia", "Isabela", "Bruna", "Cláudia", "Paula", "Vera", "Carla", "Priscila", "Fabiana", "Luciana", "Mônica", "Gisele", "Rafaela", "Marina", "Flávia", "Milena", "Kelly", "Giovanna", "Olga", "Joana", "Cristiane", "Diana", "Elaine", "Adriana", "Silvana", "Marcela", "Valéria", "Andrea", "Sandra", "Lúcia", "Andressa", "Maria", "Karine", "Regina", "Antônia", "Rosângela", "Janaína", "Michele", "Sônia", "Kátia", "Marta", "Heloísa", "Nathalia", "Alice", "Yasmin", "Sofia", "Manuela", "Valentina", "Helena", "Olívia", "Lívia", "Melissa", "Ester", "Lorena", "Elisa", "Tainá", "Vitória", "Eduarda", "Iris", "Cecília", "Clarice", "Letícia", "Isis"],
      pet: ["Rex", "Luna", "Thor", "Mel", "Bob", "Nina", "Max", "Amora", "Pipoca", "Bidu", "Fred", "Mia", "Simba", "Belinha", "Toby", "Bolinha", "Meg", "Lili", "Toddy", "Kiko", "Polly", "Caco", "Fifi", "Milo", "Aisha", "Nino", "Jasmim", "Snoopy", "Duque", "Tita", "Bibi", "Nico", "Candy", "Malu", "Pirata", "Minnie", "Caramelo", "Bolt", "Canela", "Chico", "Darth", "Diva", "Dudu", "Dumbo", "Floquinho", "Garfield", "Gigi", "Hulk", "Kiwi", "Lady", "Lassie", "Lia", "Lilo", "Lulu", "Magia", "Marley", "Mickey", "Mila", "Mimo", "Nina", "Paçoca", "Pérola", "Pimpolho", "Pongo", "Preta", "Pretinha", "Princesa", "Pudim", "Saci", "Safira", "Shakira", "Simba", "Sol", "Sombra", "Suki", "Tequila", "Tobias", "Tom", "Ursinho", "Yoda", "Zeca", "Zoe"]
    };

    const state = {
      selectedLetter: null,
      generated: "",
      recent: [],
      history: JSON.parse(sessionStorage.getItem("history") || "[]"),
      favorites: JSON.parse(localStorage.getItem("favorites") || "[]"),
      theme: localStorage.getItem("theme") || "light"
    };

    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const categoryEl = document.querySelector("#category");
    const generatedEl = document.querySelector("#generated-name");
    const historyEl = document.querySelector("#history");
    const favoritesEl = document.querySelector("#favorites");
    const statsEl = document.querySelector("#stats");
    const lengthEl = document.querySelector("#length");
    const containsEl = document.querySelector("#contains");
    const noRepeatEl = document.querySelector("#no-repeat");

    function persistFavorites() {
      localStorage.setItem("favorites", JSON.stringify(state.favorites));
    }

    function persistHistory() {
      sessionStorage.setItem("history", JSON.stringify(state.history.slice(0, 10)));
    }

    function normalize(name) {
      return name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
    }

    function getCandidates() {
      const selectedNames = [...NAMES[categoryEl.value]];
      const maxLength = Number(lengthEl.value);
      const contains = normalize((containsEl.value || "").trim());
      let candidates = selectedNames;

      if (state.selectedLetter) {
        candidates = candidates.filter((n) => normalize(n).startsWith(state.selectedLetter));
      }
      if (maxLength) {
        candidates = candidates.filter((n) => n.length <= maxLength);
      }
      if (contains) {
        candidates = candidates.filter((n) => normalize(n).includes(contains));
      }
      if (noRepeatEl.checked) {
        const recentSet = new Set(state.recent);
        const reduced = candidates.filter((n) => !recentSet.has(n));
        if (reduced.length) candidates = reduced;
      }
      return candidates;
    }

    function updateStats(candidates) {
      const totalCategory = NAMES[categoryEl.value].length;
      const items = [
        `Disponíveis: ${candidates.length}/${totalCategory}`,
        `Gerados na sessão: ${state.history.length}`,
        `Favoritos: ${state.favorites.length}`,
        state.selectedLetter ? `Inicial: ${state.selectedLetter}` : "Inicial: todas"
      ];
      statsEl.innerHTML = items.map((i) => `<span class="pill">${i}</span>`).join("");
    }

    function renderList(el, values, className) {
      el.innerHTML = values.length
        ? values.map((name) => `<li class="list-group-item d-flex justify-content-between align-items-center ${className}" data-name="${name}">${name}<i class="bi bi-arrow-up-right-circle text-secondary"></i></li>`).join("")
        : '<li class="list-group-item text-secondary">Sem itens por enquanto.</li>';
    }

    function renderAll(candidates = getCandidates()) {
      renderList(historyEl, state.history.slice(0, 10), "history-item");
      renderList(favoritesEl, state.favorites, "favorite-item");
      updateStats(candidates);
    }

    function setGeneratedName(name) {
      state.generated = name;
      generatedEl.textContent = name;
      ["#copy-btn", "#favorite-btn", "#share-btn"].forEach((id) => {
        document.querySelector(id).disabled = false;
      });
      const favoriteIcon = document.querySelector("#favorite-btn i");
      favoriteIcon.className = state.favorites.includes(name) ? "bi bi-star-fill" : "bi bi-star";
    }

    function generateName() {
      const candidates = getCandidates();
      if (!candidates.length) {
        generatedEl.textContent = "Nenhum nome encontrado para os filtros selecionados 😢";
        updateStats(candidates);
        return;
      }
      const chosen = candidates[Math.floor(Math.random() * candidates.length)];
      setGeneratedName(chosen);
      state.history.unshift(chosen);
      state.history = [...new Set(state.history)].slice(0, 10);
      state.recent.unshift(chosen);
      state.recent = state.recent.slice(0, 5);
      persistHistory();
      renderAll(candidates);
    }

    function toggleFavorite() {
      if (!state.generated) return;
      if (state.favorites.includes(state.generated)) {
        state.favorites = state.favorites.filter((n) => n !== state.generated);
      } else {
        state.favorites.unshift(state.generated);
      }
      persistFavorites();
      setGeneratedName(state.generated);
      renderAll();
    }

    async function copyName() {
      if (!state.generated) return;
      try {
        await navigator.clipboard.writeText(state.generated);
      } catch (_) {
        const helper = document.createElement("textarea");
        helper.value = state.generated;
        document.body.appendChild(helper);
        helper.select();
        document.execCommand("copy");
        helper.remove();
      }
    }

    async function shareName() {
      const text = `Olha esse nome que gerei: ${state.generated} ✨`;
      if (navigator.share) {
        try {
          await navigator.share({ title: "Gerador de Nomes", text });
          return;
        } catch (_) {}
      }
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
    }

    document.querySelector("#generate-btn").addEventListener("click", generateName);
    document.querySelector("#favorite-btn").addEventListener("click", toggleFavorite);
    document.querySelector("#share-btn").addEventListener("click", shareName);
    document.querySelector("#copy-btn").addEventListener("click", copyName);

    [categoryEl, lengthEl, containsEl, noRepeatEl].forEach((el) => el.addEventListener("input", () => renderAll()));

    historyEl.addEventListener("click", (event) => {
      const item = event.target.closest("[data-name]");
      if (item) setGeneratedName(item.dataset.name);
    });

    favoritesEl.addEventListener("click", (event) => {
      const item = event.target.closest("[data-name]");
      if (item) setGeneratedName(item.dataset.name);
    });

    function renderLetterButtons() {
      const wrapper = document.querySelector("#letters");
      wrapper.innerHTML = `<button type="button" class="${state.selectedLetter ? "" : "active"}" data-letter="">Todas</button>` +
        letters.map((l) => `<button type="button" class="${state.selectedLetter === l ? "active" : ""}" data-letter="${l}">${l}</button>`).join("");
    }

    document.querySelector("#letters").addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-letter]");
      if (!btn) return;
      state.selectedLetter = btn.dataset.letter || null;
      renderLetterButtons();
      renderAll();
    });

    document.addEventListener("keydown", (event) => {
      const tag = event.target.tagName;
      const isTyping = ["INPUT", "TEXTAREA", "SELECT"].includes(tag) || event.target.isContentEditable;
      if (event.code === "Space" && !isTyping) {
        event.preventDefault();
        generateName();
      }
    });

    function applyTheme(theme) {
      document.body.dataset.theme = theme;
      localStorage.setItem("theme", theme);
      state.theme = theme;
    }

    document.querySelector("#theme-toggle").addEventListener("click", () => {
      applyTheme(state.theme === "light" ? "dark" : "light");
    });

    applyTheme(state.theme);
    renderLetterButtons();
    renderAll();
  </script>
</body>
</html>
